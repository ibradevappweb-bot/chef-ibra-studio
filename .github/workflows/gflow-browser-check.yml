name: Test navigateur gflow-cli (sans connexion ni génération)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer un écran virtuel pour Chrome
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Installer gflow-cli
        run: npm install --global @swissmarley/gflow-cli

      - name: Détecter Chrome et configurer son chemin pour gflow-cli
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::Chrome introuvable."
            exit 1
          fi
          echo "Chrome trouvé : $CHROME_PATH"
          "$CHROME_PATH" --version
          echo "GFLOW_CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Vérifier les commandes gflow-cli
        run: gflow --help

      - name: Diagnostic gflow-cli avec écran virtuel
        shell: bash
        run: |
          echo "GFLOW_CHROME_PATH=$GFLOW_CHROME_PATH"
          echo "DISPLAY sera fourni par xvfb-run."
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" gflow doctor

      - name: Résumé
        if: always()
        run: |
          echo "Diagnostic terminé."
          echo "Aucune connexion Google n'a été tentée."
          echo "Aucune génération vidéo n'a été lancée."
