name: Vérifier Chrome et gflow-cli (sans session Google)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer un écran virtuel pour Chrome
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Installer gflow-cli
        run: npm install --global @swissmarley/gflow-cli

      - name: Détecter Chrome et configurer son chemin pour gflow-cli
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::Chrome introuvable."
            exit 1
          fi
          echo "Chrome trouvé : $CHROME_PATH"
          "$CHROME_PATH" --version
          echo "GFLOW_CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Vérifier les commandes gflow-cli
        run: gflow --help

      - name: Tester le démarrage réel de Chrome et afficher son erreur
        shell: bash
        run: |
          set -u
          PROFILE_DIR="$(mktemp -d)"
          LOG_FILE="$RUNNER_TEMP/chrome-launch.log"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" bash -c '
            set -u
            "$GFLOW_CHROME_PATH" \
              --user-data-dir="$1" \
              --remote-debugging-port=0 \
              --remote-allow-origins="*" \
              --no-first-run \
              --no-default-browser-check \
              --disable-blink-features=AutomationControlled \
              about:blank >"$2" 2>&1 &
            CHROME_PID=$!
            for i in $(seq 1 20); do
              if grep -q "DevTools listening" "$2" || [ -f "$1/DevToolsActivePort" ]; then
                echo "Chrome a démarré avec un port de débogage."
                cat "$2"
                kill "$CHROME_PID" 2>/dev/null || true
                wait "$CHROME_PID" 2>/dev/null || true
                exit 0
              fi
              if ! kill -0 "$CHROME_PID" 2>/dev/null; then
                echo "::error::Chrome s’est arrêté avant d’ouvrir le port de débogage."
                cat "$2"
                exit 1
              fi
              sleep 1
            done
            echo "::error::Chrome n’a pas ouvert le port de débogage en 20 secondes."
            cat "$2"
            kill "$CHROME_PID" 2>/dev/null || true
            wait "$CHROME_PID" 2>/dev/null || true
            exit 1
          ' bash "$PROFILE_DIR" "$LOG_FILE"

      - name: Vérifier les commandes d’authentification sans lancer de connexion
        shell: bash
        run: |
          gflow auth --help
          echo "Commandes d’authentification disponibles."

      - name: Vérifier les options de génération vidéo sans lancer de vidéo
        shell: bash
        run: |
          gflow video --help
          echo "Options de génération vidéo affichées ; aucune vidéo n’a été générée."

      - name: Résumé
        if: always()
        run: |
          echo "Vérification terminée : Chrome et gflow-cli ont été testés."
          echo "Le diagnostic doctor est volontairement exclu : il exige une session Google Flow déjà connectée."
          echo "Aucune connexion Google ni génération vidéo n’a été lancée sur ce serveur temporaire."
          echo "Le test des options vidéo vérifie seulement la commande ; il ne prouve pas que la session Google est authentifiée."
